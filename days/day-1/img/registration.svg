ss="art-title" x="145" y="258" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B1D12">instructors</text><text class="art-label" x="145" y="282" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#2B1D12">4 rows</text></svg>
