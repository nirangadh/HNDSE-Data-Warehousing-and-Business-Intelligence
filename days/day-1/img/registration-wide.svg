ss="art-title" x="260" y="157" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B1D12">instructors</text><text class="art-label" x="260" y="183" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2B1D12">4 rows</text></svg>
