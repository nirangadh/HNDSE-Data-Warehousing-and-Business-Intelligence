<text x="16" y="32" font-size="22" font-weight="700" fill="#2B1D12">The Thara Institute of Computing warehouse</text>
<rect x="16" y="42" width="60" height="6" rx="2" fill="#7A5230"/><rect x="82" y="42" width="30" height="6" rx="2" fill="#EB5600"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7A5230"/></marker></defs>
<line x1="202" y1="102" x2="436" y2="102" stroke="#7A5230" stroke-width="3" marker-end="url(#ah)"/>
